# Lowest-precedence source. A -D flag or an environment variable of the same
# name overrides anything here (see FrameworkConfig @Sources).
BASE_URL=https://restful-booker.herokuapp.com

# Free-tier Heroku sleeps. The first request of a cold run pays the dyno boot.
HTTP_CONNECT_TIMEOUT_MS=30000
HTTP_RESPONSE_TIMEOUT_MS=60000

# Token cache lifetime. Restful-Booker does not currently expire tokens, but
# caching forever is a bet on that never changing.
TOKEN_TTL_SECONDS=600

# Set true (or -DLOG_HTTP=true) to dump request/response to the console.
# Allure always gets the full exchange regardless of this setting.
LOG_HTTP=false

# BOOKER_USERNAME / BOOKER_PASSWORD are intentionally absent. Supply them via
# environment variables so they never land in the repository.
